name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SevenZipSharp.slnx
      - name: Build
        run: dotnet build SevenZipSharp.slnx --configuration Release --no-restore
      - name: Native integration tests
        run: dotnet test tests/SevenZipSharp.Tests --configuration Release --no-build --no-restore
      - name: Publish NativeAOT smoke application
        run: dotnet publish samples/SevenZipSharp.Sample --configuration Release --runtime win-x64 -p:PublishAot=true --self-contained --output artifacts/aot/win-x64
      - name: Run NativeAOT smoke checks
        run: ./artifacts/aot/win-x64/SevenZipSharp.Sample.exe self-test
