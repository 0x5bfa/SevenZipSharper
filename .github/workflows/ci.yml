name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Generate 7-Zip WinMD
        run: dotnet build SevenZipSharper.Interop/SevenZipSharper.Interop.csproj --configuration Release
      - name: Restore
        run: dotnet restore SevenZipSharper.slnx
      - name: Build
        run: dotnet build SevenZipSharper.slnx --configuration Release --no-restore
      - name: Native integration tests
        run: dotnet test SevenZipSharper.Tests --configuration Release --no-build --no-restore
      - name: Publish NativeAOT smoke application
        run: dotnet publish SevenZipSharper.Sample --configuration Release --runtime win-x64 -p:PublishAot=true --self-contained --output artifacts/aot/win-x64
      - name: Run NativeAOT smoke checks
        run: ./artifacts/aot/win-x64/SevenZipSharper.Sample.exe self-test
